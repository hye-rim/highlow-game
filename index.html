<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>하이로우</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; --red:#e5384f; --green:#4cd964; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #1fa36a 0%, #138a5a 55%, #0d6e4b 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:manipulation;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #col { width:min(100%, 420px); }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; width:100%; }
  /* 보통 모드(남은 카드 표 없음)에서도 시작·결과 안내창이 잘리지 않게 판 높이를 잡아 둔다 */
  #panel { background:rgba(255,255,255,.14); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:10px 10px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:min(540px, calc(100dvh - 70px)); }
  #topRow { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #hearts { display:flex; gap:3px; font-size:20px; line-height:1; }
  #hearts .lost { opacity:.25; filter:grayscale(1); }
  .pill { background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); padding:1px 12px; font-size:15px; white-space:nowrap; }
  #mult { background:var(--yellow); }
  #mult.off { opacity:.55; }

  #table { display:flex; align-items:center; justify-content:center; gap:22px; padding:6px 0 2px; }
  .card {
    width:118px; height:166px; border-radius:16px; background:#fff; border:4px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    position:relative; display:grid; place-items:center; font-variant-numeric:tabular-nums;
  }
  .card .corner { position:absolute; top:6px; left:9px; font-size:22px; line-height:.95; text-align:center; }
  .card .corner.br { top:auto; left:auto; bottom:6px; right:9px; transform:rotate(180deg); }
  .card .mid { font-size:56px; line-height:1; }
  .card.red { color:var(--red); }
  .card.back {
    background:
      repeating-linear-gradient(45deg, #ff7ab6 0 8px, #ff5fa2 8px 16px);
  }
  .card.back::before { content:'?'; font-size:58px; color:#fff; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; }
  .card.small { width:92px; height:130px; }
  .card.small .mid { font-size:44px; }
  .card.small .corner { font-size:18px; }
  .card.flip { animation:flip .32s ease-out; }
  @keyframes flip { 0% { transform:rotateY(90deg) scale(.9); } 100% { transform:rotateY(0) scale(1); } }
  .card.win { box-shadow:0 6px 0 var(--ink), 0 0 0 5px var(--green); }
  .card.lose { box-shadow:0 6px 0 var(--ink), 0 0 0 5px var(--red); }
  .card.tie { box-shadow:0 6px 0 var(--ink), 0 0 0 5px var(--yellow); }
  #arrowHint { font-size:30px; color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; }

  #msg { min-height:24px; font-size:17px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; }
  #picks { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .pick {
    font:inherit; font-size:24px; color:var(--ink); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 6px 8px; cursor:pointer; line-height:1.1;
  }
  .pick small { display:block; font-size:13px; color:var(--muted); margin-top:3px; min-height:15px; }
  #hiBtn { background:#ffe27a; }
  #loBtn { background:#bfe3ff; }
  .pick:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .pick:disabled { opacity:.5; cursor:default; }
  #swapBtn {
    font:inherit; font-size:16px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px;
    box-shadow:0 4px 0 var(--ink); padding:5px 20px; cursor:pointer;
  }
  #swapBtn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #swapBtn:disabled { opacity:.45; cursor:default; }

  #tracker { display:grid; grid-template-columns:repeat(13, 1fr); gap:3px; width:100%; }
  #tracker:empty { display:none; }
  #tracker .t { background:#fff; border:2px solid var(--ink); border-radius:8px; text-align:center; font-size:12px; line-height:1.15; padding:2px 0; }
  #tracker .t b { display:block; font-weight:400; font-size:11px; color:var(--muted); }
  #tracker .t.now { background:var(--yellow); }
  #tracker .t.gone { opacity:.35; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    .card { width:100px; height:140px; } .card .mid { font-size:46px; }
    .card.small { width:80px; height:112px; } .card.small .mid { font-size:38px; }
    #panel { gap:7px; }
    .pick { font-size:21px; padding:8px 6px 6px; }
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">연속</span><span class="value" id="streak">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="wrap">
      <div id="panel">
        <div id="topRow"><div id="hearts"></div><div class="pill" id="mult">×1.0</div><div class="pill" id="left">🃏 51</div></div>
        <div id="table">
          <div class="card" id="curCard"></div>
          <div id="arrowHint">▶</div>
          <div class="card small back" id="nextCard"></div>
        </div>
        <div id="msg" aria-live="polite"></div>
        <div id="picks">
          <button class="pick" id="hiBtn">▲ 높다<small id="hiOdds"></small></button>
          <button class="pick" id="loBtn">▼ 낮다<small id="loOdds"></small></button>
        </div>
        <button id="swapBtn">🔄 바꾸기 ×3</button>
        <div id="tracker"></div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
